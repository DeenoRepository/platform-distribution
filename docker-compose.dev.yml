services:
  postgres:
    image: postgres:16-alpine
    container_name: ems-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems_admin
      POSTGRES_PASSWORD: ems_secure_password
      POSTGRES_DB: ems_platform
    ports:
      - "5432:5432"
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_admin -d ems_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ems-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-shell:
    image: node:20-alpine
    container_name: ems-dev-shell
    restart: unless-stopped
    working_dir: /app
    command: node dist/server.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ems_admin:ems_secure_password@postgres:5432/ems_platform
      REDIS_URL: redis://redis:6379
      PORT: 3000
    volumes:
      - ../platform-shell:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  dev-pgdata:
